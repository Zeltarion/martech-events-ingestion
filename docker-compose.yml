services:
  postgres:
    image: postgres:16-alpine
    container_name: mei-postgres
    environment:
      POSTGRES_DB: martech_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d martech_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: mei-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mei-migrate
    command: ["sh", "-c", "npm run migration:run:compiled"]
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mei-api
    command: ["node", "dist/entrypoints/api.main.js"]
    env_file:
      - .env.example
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mei-worker
    command: ["node", "dist/entrypoints/worker.main.js"]
    env_file:
      - .env.example
    environment:
      WORKER_PORT: 3002
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3002:3002"

  reports:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mei-reports
    command: ["node", "dist/entrypoints/reports.main.js"]
    env_file:
      - .env.example
    environment:
      REPORTS_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3001:3001"

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: mei-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
      reports:
        condition: service_started
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.1
    container_name: mei-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    ports:
      - "3003:3000"

  loki:
    image: grafana/loki:3.4.2
    container_name: mei-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./ops/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.4.2
    container_name: mei-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  publisher:
    image: andriiuni/events:latest
    container_name: mei-publisher
    environment:
      EVENT_ENDPOINT: http://api:3000/webhook
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  promtail_positions:
